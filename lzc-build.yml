# 构建脚本：装依赖后跑 Vite 构建
# 写在这里而不是放在 CI 里，是为了让 `lzc-cli project release` 一条命令自足，
# 任何智能体或 CI 只要装了 lzc-cli 就能出包，不需要预先知道项目怎么构建。
# mkdir 不能省：lzc-cli 不会自动创建 pkgout 目录，目录不存在会直接报错退出
# （「<路径> 不存在」），失败点还发生在打包最后一步，容易误判成构建失败。
buildscript: npm install && npm run build && mkdir -p dist-lpk

manifest: ./lzc-manifest.yml

# Vite 产物目录（vite.config.ts 里 outDir 也是 ./dist）
contentdir: ./dist

# lpk 包输出目录
pkgout: ./dist-lpk

icon: ./lzc-icon.png
